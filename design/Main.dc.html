<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif; }
    a { color: #c9f31d; text-decoration: none; }
    a:hover { color: #dcff5c; }
    .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; display: flex; background: #0d0e10; color: #f2f3f5; overflow: hidden;">

  <!-- ЛЕВАЯ КОЛОНКА -->
  <div style="width: 384px; min-width: 384px; display: flex; flex-direction: column; background: #121316; border-right: 1px solid #24272d;">

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 14px 20px;">
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <span style="font-size: 21px; font-weight: 700; letter-spacing: -0.03em;">telegleb</span>
        <span class="mono" style="font-size: 10px; color: #6e747e; letter-spacing: 0.08em;">V1</span>
      </div>
      <div style="display: flex; gap: 4px;">
        <div style="width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: #1b1e23;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9aa1ac" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </div>
        <div style="width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: #1b1e23;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9aa1ac" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        </div>
      </div>
    </div>

    <div style="padding: 0 16px 12px 16px;">
      <div style="display: flex; align-items: center; gap: 10px; background: #1b1e23; border: 1px solid #262a31; border-radius: 12px; padding: 10px 12px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6e747e" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        <span style="font-size: 14px; color: #6e747e;">Поиск по чатам</span>
      </div>
    </div>

    <!-- ПАПКИ. Раскладка приходит с сервера вместе с чатами -->
    <div style="display: flex; gap: 6px; padding: 0 16px 14px 16px; overflow: hidden;">
      <div style="padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; background: {{accent}}; color: #0d0e10;">Все</div>
      <div style="padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 500; background: #1b1e23; color: #9aa1ac; display: flex; align-items: center; gap: 6px;">Работа<span class="mono" style="font-size: 11px; color: #6e747e;">13</span></div>
      <div style="padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 500; background: #1b1e23; color: #9aa1ac;">Каналы</div>
      <div style="padding: 7px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; background: #1b1e23; color: #9aa1ac; display: flex; align-items: center; gap: 6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8h16v11H4z"/><path d="M2 5h20v3H2zM10 12h4"/></svg>
        <span class="mono" style="font-size: 11px; color: #6e747e;">8</span>
      </div>
    </div>

    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; padding: 0 10px; overflow: hidden;">
      <sc-for list="{{chats}}" as="c" hint-placeholder-count="7">
        <div style="display: flex; align-items: center; gap: 12px; padding: {{rowPad}}; border-radius: 14px; background: {{c.bg}};">
          <div style="position: relative; width: 46px; height: 46px; min-width: 46px;">
            <div style="width: 46px; height: 46px; border-radius: 15px; background: {{c.avatarBg}}; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: {{c.avatarFg}};">{{c.initials}}</div>
          </div>

          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
            <div style="display: flex; align-items: center; gap: 6px;">
              <sc-if value="{{c.priority}}" hint-placeholder-val="{{true}}">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="{{accent}}" stroke="none" style="flex-shrink: 0;"><path d="M12 3l2.6 5.6 6.1.8-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6L3.3 9.4l6.1-.8z"/></svg>
              </sc-if>
              <span style="font-size: 14.5px; font-weight: 600; color: {{c.titleColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{c.title}}</span>
              <span class="mono" style="margin-left: auto; font-size: 11px; color: {{c.timeColor}}; flex-shrink: 0;">{{c.time}}</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="flex: 1; min-width: 0; font-size: 13.5px; color: {{c.previewColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{c.preview}}</span>
              <sc-if value="{{c.unread}}" hint-placeholder-val="{{true}}">
                <span class="mono" style="background: {{c.badgeBg}}; color: {{c.badgeFg}}; font-size: 11px; font-weight: 500; min-width: 21px; height: 21px; border-radius: 999px; display: flex; align-items: center; justify-content: center; padding: 0 6px; flex-shrink: 0;">{{c.unread}}</span>
              </sc-if>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- ОКНО ЧАТА -->
  <div style="flex: 1; display: flex; flex-direction: column; background: #0d0e10; min-width: 0;">

    <div style="display: flex; align-items: center; gap: 14px; padding: 16px 26px; border-bottom: 1px solid #24272d;">
      <div style="width: 42px; height: 42px; border-radius: 14px; background: #2f3640; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #dfe3e8;">ОВ</div>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div style="display: flex; align-items: center; gap: 7px;">
          <span style="font-size: 15.5px; font-weight: 600;">Ольга Ветрова</span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="{{accent}}" stroke="none"><path d="M12 3l2.6 5.6 6.1.8-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6L3.3 9.4l6.1-.8z"/></svg>
        </div>
        <span style="font-size: 12.5px; color: #6e747e;">была в сети 4 минуты назад</span>
      </div>
      <div style="margin-left: auto; display: flex; gap: 6px;">
        <div style="width: 36px; height: 36px; border-radius: 11px; background: #1b1e23; display: flex; align-items: center; justify-content: center;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9aa1ac" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        </div>
        <div style="width: 36px; height: 36px; border-radius: 11px; background: #1b1e23; display: flex; align-items: center; justify-content: center;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9aa1ac" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>
        </div>
      </div>
    </div>

    <div style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 26px 26px 18px 26px; overflow: hidden;">
      <div style="align-self: center; padding: 5px 13px; border-radius: 999px; background: #191c21; font-size: 11.5px; color: #6e747e; letter-spacing: 0.02em;">7 сентября</div>

      <sc-for list="{{messages}}" as="m" hint-placeholder-count="6">
        <div style="max-width: 480px; align-self: {{m.align}}; display: flex; flex-direction: column; gap: 4px;">
          <div style="background: {{m.bg}}; color: {{m.fg}}; padding: 11px 15px; border-radius: {{m.radius}}; font-size: 14.5px; line-height: 1.45;">{{m.text}}</div>
          <span class="mono" style="font-size: 10.5px; color: #5c626b; align-self: {{m.align}};">{{m.time}}</span>
        </div>
      </sc-for>
    </div>

    <div style="padding: 0 26px 24px 26px;">
      <div style="display: flex; align-items: center; gap: 12px; background: #16181c; border: 1px solid #262a31; border-radius: 16px; padding: 12px 12px 12px 18px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#6e747e" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.5l-8.4 8.4a5 5 0 0 1-7-7l8.9-8.9a3.3 3.3 0 0 1 4.7 4.7l-8.9 8.9a1.7 1.7 0 0 1-2.3-2.3l8.2-8.2"/></svg>
        <span style="flex: 1; font-size: 14.5px; color: #5c626b;">Написать сообщение</span>
        <div style="width: 38px; height: 38px; border-radius: 12px; background: {{accent}}; display: flex; align-items: center; justify-content: center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#0d0e10" stroke="none"><path d="M3 20.5l18-8.5L3 3.5V10l12 2-12 2z"/></svg>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{
  "accent": {"editor": "color", "default": "#c9f31d", "options": ["#c9f31d", "#7dd3fc", "#fb923c", "#e879f9"], "section": "Стиль"},
  "compact": {"editor": "boolean", "default": false, "section": "Стиль"},
  "$preview": {"width": 1440, "height": 900}
}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#c9f31d';
    const compact = this.props.compact ?? false;

    // Активный чат подсвечивается акцентом, остальные — нейтральные.
    const chat = (o) => ({
      titleColor: o.active ? '#0d0e10' : '#e8eaee',
      timeColor: o.active ? 'rgba(13,14,16,.55)' : '#5c626b',
      previewColor: o.active ? 'rgba(13,14,16,.7)' : '#8b9099',
      badgeBg: o.active ? '#0d0e10' : accent,
      badgeFg: o.active ? accent : '#0d0e10',
      bg: o.active ? accent : 'transparent',
      ...o,
    });

    return {
      accent,
      rowPad: compact ? '8px 10px' : '11px 10px',
      chats: [
        chat({ initials: 'ОВ', avatarBg: '#2f3640', avatarFg: '#dfe3e8', title: 'Ольга Ветрова', time: '14:32', preview: 'ок, договорились на 19:00', unread: '2', priority: true, active: true }),
        chat({ initials: 'TD', avatarBg: '#243040', avatarFg: '#9dc0e8', title: 'Telegleb / dev', time: '14:18', preview: 'Глеб: контракт v1 задеплоен', unread: '12', priority: true }),
        chat({ initials: 'ИЗ', avatarBg: '#2a2f26', avatarFg: '#c2d69a', title: 'Избранное', time: '13:04', preview: 'ссылка на доклад про MTProto', unread: '' }),
        chat({ initials: 'ПР', avatarBg: '#332a3d', avatarFg: '#cbaee0', title: 'Продуктовая рассылка', time: '12:40', preview: 'Что нового в сентябре', unread: '' }),
        chat({ initials: 'М', avatarBg: '#3d2f2a', avatarFg: '#e0b8a4', title: 'Маша', time: '11:22', preview: 'Вы: сейчас скину', unread: '' }),
        chat({ initials: 'СД', avatarBg: '#25353a', avatarFg: '#98c9d4', title: 'Курс: системный дизайн', time: '10:15', preview: 'Артём: дедлайн перенесли', unread: '4' }),
        chat({ initials: 'Р', avatarBg: '#38312a', avatarFg: '#d8c3a5', title: 'Родители', time: 'вчера', preview: 'Мама: не забудь позвонить', unread: '' }),
      ],
      messages: [
        { align: 'flex-start', bg: '#1b1e23', fg: '#e8eaee', radius: '18px 18px 18px 6px', text: 'Привет! Успеешь сегодня посмотреть макеты?', time: '14:02' },
        { align: 'flex-end', bg: accent, fg: '#0d0e10', radius: '18px 18px 6px 18px', text: 'Да, после обеда сяду', time: '14:09' },
        { align: 'flex-start', bg: '#1b1e23', fg: '#e8eaee', radius: '18px 18px 18px 6px', text: 'Отлично. Последняя версия лежит в теме «Дизайн» в рабочем чате', time: '14:11' },
        { align: 'flex-end', bg: accent, fg: '#0d0e10', radius: '18px 18px 6px 18px', text: 'Видел. На узком экране кнопки в шапке разъезжаются', time: '14:24' },
        { align: 'flex-start', bg: '#1b1e23', fg: '#e8eaee', radius: '18px 18px 18px 6px', text: 'Поправлю сегодня. Во сколько созвон?', time: '14:29' },
        { align: 'flex-start', bg: '#1b1e23', fg: '#e8eaee', radius: '18px 18px 18px 6px', text: 'ок, договорились на 19:00', time: '14:32' },
      ],
    };
  }
}
</script>
</body>
</html>
