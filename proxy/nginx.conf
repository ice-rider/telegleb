# Реверс-прокси: терминирует TLS и разводит трафик между фронтом и API.
# Сертификат и ключ монтируются с хоста в /etc/nginx/certs — в образ они не
# попадают, поэтому обновление сертификата не требует пересборки.

# Тюнинг апстримов вынесен наверх, чтобы не дублировать в каждом location.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

server {
    listen 80 default_server;
    server_name nammilana.ru www.nammilana.ru;

    # Единственное, что отдаётся по http, — редирект.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name nammilana.ru www.nammilana.ru;

    ssl_certificate     /etc/nginx/certs/fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/private.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Вложение уходит одним ответом, поэтому лимит выше дефолтного.
    client_max_body_size 20m;

    # HSTS ставится на границе TLS, а не во внутреннем контейнере.
    # includeSubDomains намеренно не используется: в SAN сертификата есть
    # mail/owa/autodiscover, и принудительный HTTPS сломал бы их, если они
    # обслуживаются по http на другом хосте.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/ {
        proxy_pass http://backend:8080;

        # Запрос в MTProto может идти долго: клиент поднимается, ходит в
        # несколько дата-центров и только потом отвечает.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Медиа отдаётся чанками — буферизация здесь только вредит.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://frontend:80;
    }
}
