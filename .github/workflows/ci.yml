name: CI/CD

on:
  push:
    branches: [main, dev, refactor/api-contract-v1]
  pull_request:
    branches: [main]

concurrency:
  # Выкатывать одновременно две сборки одной ветки нельзя — вторая
  # перезапишет образы первой прямо во время её деплоя.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Тесты и типы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: go vet
        working-directory: server
        run: go vet ./...

      - name: go test
        working-directory: server
        run: go test ./... -count=1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: npm ci
        working-directory: client
        run: npm ci

      - name: Проверка типов и сборка фронта
        working-directory: client
        run: npm run build

  build:
    name: Сборка образов
    needs: test
    # В PR только проверяем, что всё собирается: публиковать нечего.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: backend
            context: server
          - service: frontend
            context: client
          - service: proxy
            context: proxy
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Имя пакета в нижнем регистре
        id: repo
        run: echo "lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.lower }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.lower }}/${{ matrix.service }}:${{ github.sha }}

  deploy:
    name: Выкатка на сервер
    needs: build
    # Прод обновляется только с основной ветки.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Подготовить ssh
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Обновить compose на сервере
        run: |
          scp -i ~/.ssh/id_ed25519 docker-compose.prod.yaml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/telegleb/docker-compose.yaml"

      - name: Подтянуть образы и перезапустить
        env:
          REPO_LOWER: ${{ github.repository }}
        run: |
          # Токен живёт только на время этого шага, на сервере не сохраняется.
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -e
             echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
             cd /opt/telegleb
             docker compose pull
             docker compose up -d --remove-orphans
             docker logout ghcr.io
             docker image prune -f"

      - name: Проверить, что сервис поднялся
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 https://www.nammilana.ru/api/v1/health | grep -q '"status":"ok"'; then
              echo "здоров"
              exit 0
            fi
            sleep 5
          done
          echo "сервис не поднялся за 150 секунд"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "docker compose -f /opt/telegleb/docker-compose.yaml logs --tail 60 backend"
          exit 1
